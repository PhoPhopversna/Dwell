server:
  port: 8084
spring:
  application:
    name: product-catalog
  datasource:
    url: jdbc:postgresql://localhost:5432/product-catalog
    username: tixly-ticket
    password: tixly123
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: true
    consumer:
      group-id: default-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "com.neo.event"
        spring.json.use.type.headers: true
    listener:
      ack-mode: manual_immediate
      concurrency: 3

app:
  kafka:
    partitions: 3
    replicas: 1

    image-uploaded:
      topic: product-image-uploaded
      dlt: product-image-uploaded.DLT
    image-deleted:
      topic: product-image-deleted
      dlt: product-image-deleted.DLT
    alert:
      topic: alert-topic
      dlt: alert-topic.DLT
      group-id: alert-group
minio:
