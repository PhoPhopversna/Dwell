# Single-binary Loki with local filesystem storage. Placeholders with defaults below are filled
# from environment variables (docker-compose passes them; Loki runs with -config.expand-env=true).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # How long logs are kept (default 7 days). Deletion is done by the compactor below.
  retention_period: ${LOKI_RETENTION_PERIOD:-168h}
  ingestion_rate_mb: ${LOKI_INGESTION_RATE_MB:-8}
  ingestion_burst_size_mb: ${LOKI_INGESTION_BURST_MB:-16}
  # Labels are low-cardinality only (service_name, environment, level); correlationId stays in the
  # log line and is queried with | json | correlationId="...".
  max_label_names_per_series: 10
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: true
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules

analytics:
  reporting_enabled: false
