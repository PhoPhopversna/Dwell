server:
  port: 8081

spring:
  application:
    name: api-gateway
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/gateway
    username: tixly-ticket
    password: tixly123
  sql:
    init:
      mode: always

  # Redis configuration - explicitly disable repositories
  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false

  cloud:
    gateway:
      discovery:
        locator:
          enabled: false

      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 10
            redis-rate-limiter.burstCapacity: 20
            key-resolver: "#{@ipKeyResolver}"

      routes:
        - id: health-check
          uri: http://localhost:8081
          predicates:
            - Path=/health
          filters:
            - StripPrefix=1

  security:
    oauth2:
      resourceserver:
        jwt:
          # Must be the realm the identity service logs users into.
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:Dwell}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8080/realms/Dwell}

app:
  # Shared secret added to every forwarded request; downstream services reject requests without it.
  gateway-auth:
    header-name: X-Gateway-Secret
    secret: ${GATEWAY_SECRET:dwell-dev-gateway-secret}

  # JWT + role checks. Each route's allowed realm roles live in routes.roles
  # (comma-separated, or PUBLIC). Routes with no roles are denied.
  security:
    admin-role: ADMIN # needed for /api/routes (route admin API)
    public-paths: # always callable without a token, so users can obtain one
      - /identity/api/auth/login
      - /identity/api/auth/register
      - /identity/api/auth/refresh
      - /identity/api/auth/logout
      - /health

management:
  endpoints:
    web:
      exposure:
        include: refresh,health,info,gateway,env

# Optional: logging for debugging
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger - %msg%n"