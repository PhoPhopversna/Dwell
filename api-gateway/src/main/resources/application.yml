server:
  port: 8081

spring:
  application:
    name: api-gateway
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/gateway
    username: tixly-ticket
    password: tixly123
  sql:
    init:
      mode: always

  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false

  cloud:
    gateway:
      # Connect failure -> 503 (DownstreamErrorFilter), no response in time -> 504
      httpclient:
        connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:5000}
        response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:30s}
      discovery:
        locator:
          enabled: false

      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 10
            redis-rate-limiter.burstCapacity: 20
            key-resolver: "#{@ipKeyResolver}"

      routes:
        - id: health-check
          uri: http://localhost:8081
          predicates:
            - Path=/health
          filters:
            - StripPrefix=1

  security:
    oauth2:
      resourceserver:
        jwt:
          # Must be the realm the identity service logs users into.
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:Dwell}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8080/realms/Dwell}

app:
  environment: ${APP_ENV:local}
  gateway-auth:
    header-name: X-Gateway-Secret
    secret: ${GATEWAY_SECRET:dwell-dev-gateway-secret}

  # Each route's allowed permissions live in routes.permissions (comma-separated, any one is
  # enough, or PUBLIC); none = denied. /api/routes needs route:manage.
  security:
    public-paths: # always callable without a token, so users can obtain one
      - /identity/api/auth/login
      - /identity/api/auth/register
      - /identity/api/auth/refresh
      - /identity/api/auth/logout
      - /health

management:
  endpoints:
    web:
      exposure:
        include: refresh,health,info,gateway,env

logging:
  structured:
    format:
      console: ${LOG_CONSOLE_FORMAT:com.neo.logging.DwellJsonLogFormatter}
      file: com.neo.logging.DwellJsonLogFormatter
  file:
    name: ${LOG_DIR:logs}/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: ${LOG_MAX_FILE_SIZE:50MB}
      max-history: ${LOG_MAX_HISTORY:7}
      total-size-cap: ${LOG_TOTAL_SIZE_CAP:1GB}
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.neo: ${LOG_LEVEL_APP:INFO}
    com.neo.logging.access: ${LOG_LEVEL_ACCESS:INFO}
    # Unhandled errors are already logged once by the access filter
    org.springframework.boot.autoconfigure.web.reactive.error.AbstractErrorWebExceptionHandler: OFF
