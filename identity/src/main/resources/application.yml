server:
  port: 8083
spring:
  application:
    name: identity-service
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/identity
    username: tixly-ticket
    password: tixly123
  webflux:
    base-path: /identity
  sql:
    init:
      mode: always
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/realms/Dwell/protocol/openid-connect/certs
          issuer-uri: http://localhost:8080/realms/Dwell
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
keycloak:
  url: ${KEYCLOAK_URL:http://localhost:8080}
  realm: ${KEYCLOAK_REALM:Dwell}
  client-id: ${KEYCLOAK_CLIENT_ID:dwell-client}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:1dKFNJe5JGkrx3NcOQo9I1k7WBflDgh3}
  admin-username: ${KEYCLOAK_ADMIN_USERNAME:admin}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
  admin-client-id: admin-cli
  token-ttl: 55 # access token TTL (Keycloak default 60s)
  refresh-token-ttl: 1740 # refresh token TTL (Keycloak default 1800s/30min)
app:
  # Loki "environment" label + JSON field. e.g. local, dev, staging, prod
  environment: ${APP_ENV:local}
  # Only accept requests forwarded by the API gateway (it adds this header + secret).
  gateway-auth:
    enabled: ${GATEWAY_AUTH_ENABLED:true}
    header-name: X-Gateway-Secret
    secret: ${GATEWAY_SECRET:dwell-dev-gateway-secret}
    excluded-paths: [] # e.g. /actuator/health

  # Optionally creates the first ADMIN at startup (idempotent; never resets an existing
  # password). OFF by default: in production create the admin in the Keycloak console, or
  # set BOOTSTRAP_ENABLED=true + BOOTSTRAP_ADMIN_PASSWORD from a secret store.
  # Local dev: run with SPRING_PROFILES_ACTIVE=local (see application-local.yml).
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:false}
    realm-roles: [ADMIN, CUSTOMER]
    admin-role: ADMIN
    admin-username: ${BOOTSTRAP_ADMIN_USERNAME:dwell_admin}
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:dwell_admin@example.com}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: refresh,health,info,gateway,env


webclient:
  timeout:
    connect: 5000      # 5 seconds
    response: 7000     # 7 seconds
    read: 7000
    write: 7000

logging:
  # One JSON object per line (see common-logging DwellJsonLogFormatter), on console and in
  # ${LOG_DIR}/<service>.log, which Grafana Alloy tails and ships to Loki.
  structured:
    format:
      console: ${LOG_CONSOLE_FORMAT:com.neo.logging.DwellJsonLogFormatter}
      file: com.neo.logging.DwellJsonLogFormatter
  file:
    name: ${LOG_DIR:logs}/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: ${LOG_MAX_FILE_SIZE:50MB}
      max-history: ${LOG_MAX_HISTORY:7}
      total-size-cap: ${LOG_TOTAL_SIZE_CAP:1GB}
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.neo: ${LOG_LEVEL_APP:INFO}
    # request/response lines (com.neo.logging.AccessLogger); DEBUG also logs "Request received"
    com.neo.logging.access: ${LOG_LEVEL_ACCESS:INFO}
    org.springframework.boot.autoconfigure.web.reactive.error.AbstractErrorWebExceptionHandler: OFF
