# Local development only: activate with SPRING_PROFILES_ACTIVE=local
# Creates dwell_admin / Admin@12345 with realm role ADMIN on startup (used by the Postman collection).
app:
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:true}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin@12345}
keycloak:
  # Local dev realm's admin service client; set real values via env everywhere else
  service-client-id: ${KEYCLOAK_SERVICE_CLIENT_ID:dwell-admin}
  service-client-secret: ${KEYCLOAK_SERVICE_CLIENT_SECRET:gvExtrVp0SbQzCQcdRQtA8V86ttBpcgk}
